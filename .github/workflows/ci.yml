name: ci

# Stack-aware CI. `detect` decides which stacks are present; `node` and `python`
# run independently (both can run in one repo); `ci` is the aggregate gate that
# branch protection requires as a status check.
#
# Every action below is pinned to a full commit SHA. Dependabot's github-actions
# ecosystem (.github/dependabot.yml) keeps the pins current — do not replace a
# SHA with a floating tag.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect stacks
        id: detect
        run: |
          node=false
          python=false

          if [ -f package.json ]; then
            node=true
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python=true
          fi

          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected: node=$node python=$python"

          if [ "$node" = "false" ] && [ "$python" = "false" ]; then
            echo "::error::No supported stack detected. Add a package.json (Node) or a pyproject.toml/requirements.txt (Python). An empty repository must not pass CI."
            exit 1
          fi

  node:
    name: node
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No \"lint\" script in package.json — skipping lint."
          fi

      - name: Test
        # Hard failure by design: no --if-present. A project without tests
        # should add them, not silently pass.
        run: npm test

      - name: Smoke test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.smoke ? 0 : 1)"; then
            npm run smoke
          else
            echo "::error::No \"smoke\" script defined in package.json. Every project must define one: it should build the app, start it, and verify it stays alive (e.g. poll a health endpoint for N seconds and fail if the process exits). See CLAUDE.md."
            exit 1
          fi

  python:
    name: python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            # Prefer the [dev] extra; fall back to the bare package if absent.
            pip install -e ".[dev]" || pip install -e .
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # CI tooling, so the lint/test steps below are meaningful even when
          # the project does not declare them itself.
          pip install pytest ruff

      - name: Lint (advisory)
        # Advisory only. Delete the "|| true" to enforce ruff in CI.
        run: ruff check . || true

      - name: Test
        run: pytest -q

      - name: Smoke test
        run: |
          if [ -x scripts/smoke.sh ]; then
            ./scripts/smoke.sh
          elif [ -f scripts/smoke.sh ]; then
            echo "::error::scripts/smoke.sh exists but is not executable. Run: chmod +x scripts/smoke.sh && git update-index --chmod=+x scripts/smoke.sh"
            exit 1
          else
            echo "::error::No executable scripts/smoke.sh found. Every project must define one: it should build the app, start it, and verify it stays alive (e.g. poll a health endpoint for N seconds and fail if the process exits). See CLAUDE.md."
            exit 1
          fi

  ci:
    # Aggregate gate. Branch protection requires the "ci" status check, and a
    # workflow name is not a check name — this job supplies it. `always()` plus
    # the explicit result test means a skipped stack job passes but a failed or
    # cancelled one does not.
    name: ci
    needs: [detect, node, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          detect="${{ needs.detect.result }}"
          node="${{ needs.node.result }}"
          python="${{ needs.python.result }}"
          echo "detect=$detect node=$node python=$python"

          failed=0
          for r in "$detect" "$node" "$python"; do
            case "$r" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
